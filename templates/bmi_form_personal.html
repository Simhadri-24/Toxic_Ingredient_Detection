<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Personal Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6f61; /* Coral for buttons and accents */
            --secondary-color: #2c3e50; /* Dark blue for text and headers */
            --bg-gradient: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            --input-border: #dfe6e9;
            --input-focus: #ff6f61;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        /* Subtle background pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,%3Csvg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23dfe6e9" fill-opacity="0.2"%3E%3Cpath d="M0 0h2v2H0zM10 10h2v2h-2z"/%3E%3C/g%3E%3C/svg%3E');
            z-index: -1;
        }

        .container {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
        }

        h2::after {
            content: '';
            width: 50px;
            height: 3px;
            background: var(--primary-color);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        label {
            display: block;
            font-size: 1em;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--secondary-color);
            text-align: left;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: #f9f9f9;
            font-size: 1em;
            color: var(--secondary-color);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 8px rgba(255, 111, 97, 0.3);
            outline: none;
        }

        input[type="submit"], .home-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        input[type="submit"]:hover, .home-btn:hover {
            background: #e55a4f;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 111, 97, 0.4);
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        /* Decorative elements */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 111, 97, 0.2);
            z-index: -1;
        }

        .decor-circle:nth-child(1) {
            width: 100px;
            height: 100px;
            top: -50px;
            left: -50px;
        }

        .decor-circle:nth-child(2) {
            width: 80px;
            height: 80px;
            bottom: -40px;
            right: -40px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
                max-width: 90%;
            }

            h2 {
                font-size: 1.8em;
            }

            .button-group {
                flex-direction: column;
                gap: 15px;
            }

            input[type="submit"], .home-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decor-circle"></div>
        <div class="decor-circle"></div>
        <h2>BMI Calculator</h2>
        <form action="{{ url_for('bmi_meals') }}" method="post">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" name="weight" placeholder="Enter your weight" required min="0" step="0.1">

            <label for="height">Height (cm)</label>
            <input type="number" id="height" name="height" placeholder="Enter your height" required min="0" step="0.1">

            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter your age" required min="0">

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <div class="button-group">
                <a href="{{ url_for('home') }}" class="home-btn">Home</a>
                <input type="submit" value="Next">
            </div>
        </form>
    </div>
</body>
</html>
